name: Unity build

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unity-build.yml

permissions:
  contents: read

jobs:
  build:
    # This workflow passes repository secrets to build code. Reusable callers
    # may use the existing same-repository PR trust policy; the direct PR route
    # is limited to owner-authored and owner-triggered PRs. Fork PRs and
    # pull_request_target callers remain excluded. Direct and reusable manual
    # dispatches are main-only. Branch and tag refs use their event-specific
    # rules below. Exclude this workflow's own path from reusable-caller checks
    # so its direct triggers cannot use the wider caller policy.
    if: >-
      github.repository == 'kurone-kito/DDMMHBC' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@refs/heads/main'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.actor == github.repository_owner &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.workflow_ref == format('kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@{0}', github.ref) &&
          github.event.pull_request.base.repo.full_name == 'kurone-kito/DDMMHBC' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == 'kurone-kito/DDMMHBC'
        ) ||
        (
          !startsWith(github.workflow_ref, 'kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@') &&
          (
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (
              github.event_name == 'push' &&
              startsWith(github.ref, 'refs/tags/v') &&
              github.actor == github.repository_owner &&
              github.workflow_ref == format('kurone-kito/DDMMHBC/.github/workflows/release.yml@{0}', github.ref)
            ) ||
            (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')) ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.base.repo.full_name == 'kurone-kito/DDMMHBC' &&
              github.event.pull_request.base.ref == 'main' &&
              github.event.pull_request.head.repo.full_name == 'kurone-kito/DDMMHBC'
            )
          )
        )
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneLinux64
            runner: ubuntu-24.04
          - targetPlatform: StandaloneWindows64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare isolated Unity project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -L build || ( -e build && ! -d build ) ]]; then
            echo 'The build directory is not a safe directory.' >&2
            exit 1
          fi
          mkdir -p build
          if [[ -e build/UnityProject || -L build/UnityProject ]]; then
            echo 'The temporary Unity project path already exists.' >&2
            exit 1
          fi
          mkdir build/UnityProject
          git archive HEAD Assets Packages ProjectSettings | tar -x -C build/UnityProject

      - name: Build Unity player
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          projectPath: build/UnityProject
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: build
          versioning: None
          runAsHostUser: ${{ runner.os == 'Linux' }}

      - name: Remove isolated Unity project
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e build && ! -L build ]]; then
            exit 0
          fi
          if [[ -L build || ! -d build ]]; then
            echo 'The build path is not a safe directory.' >&2
            exit 1
          fi
          project_path=build/UnityProject
          if [[ -L "$project_path" ]]; then
            echo 'The temporary Unity project path is a symbolic link.' >&2
            exit 1
          fi
          if [[ -e "$project_path" ]]; then
            if [[ ! -d "$project_path" ]]; then
              echo 'The temporary Unity project path is not a directory.' >&2
              exit 1
            fi
            rm -rf -- "$project_path"
          fi

      - name: Verify build output is source-safe and secret-free
        env:
          TARGET_PLATFORM: ${{ matrix.targetPlatform }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          const credentials = [
            process.env.UNITY_LICENSE,
            process.env.UNITY_EMAIL,
            process.env.UNITY_PASSWORD,
          ];
          if (credentials.some((value) => typeof value !== 'string' || value.length === 0)) {
            fail('A required Unity credential is unavailable for output verification.');
          }

          const status = spawnSync(
            'git',
            ['status', '--porcelain=v1', '--untracked-files=all', '-z'],
            { encoding: 'utf8' },
          );
          if (status.error || status.status !== 0) {
            fail('Could not verify that the Unity build left source files unchanged.');
          }

          const changes = status.stdout.split('\0').filter(Boolean);
          const unexpectedChanges = changes.filter((entry) => {
            const changedPath = entry.slice(3);
            return !changedPath.startsWith('build/');
          });
          if (unexpectedChanges.length > 0) {
            for (const entry of unexpectedChanges) {
              const statusCode = entry.slice(0, 2);
              const changedPath = entry.slice(3);
              const safePath = credentials.some((credential) =>
                changedPath.includes(credential),
              )
                ? '[REDACTED PATH]'
                : changedPath;
              console.error(
                `Unexpected Unity build workspace change (${statusCode}): ${JSON.stringify(safePath)}`,
              );
            }
            fail('The Unity build changed source files or wrote files outside build/.');
          }

          const buildRoot = path.resolve('build');
          const outputRoot = path.join(buildRoot, process.env.TARGET_PLATFORM);
          let buildRootInfo;
          let outputRootInfo;
          try {
            buildRootInfo = fs.lstatSync(buildRoot);
            outputRootInfo = fs.lstatSync(outputRoot);
          } catch {
            fail('The Unity build output directory is missing.');
          }
          if (
            buildRootInfo.isSymbolicLink() ||
            !buildRootInfo.isDirectory() ||
            outputRootInfo.isSymbolicLink() ||
            !outputRootInfo.isDirectory()
          ) {
            fail('The Unity build output directory is missing or unsafe.');
          }

          const secretBytes = credentials.map((value) => Buffer.from(value, 'utf8'));
          const carrySize = Math.max(...secretBytes.map((value) => value.length)) - 1;

          async function* filesUnder(directory) {
            for (const entry of await fs.promises.readdir(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                yield* filesUnder(entryPath);
              } else if (entry.isSymbolicLink()) {
                fail('The Unity build output contains a symbolic link.');
              } else if (entry.isFile()) {
                yield entryPath;
              }
            }
          }

          async function containsCredential(filePath) {
            let carry = Buffer.alloc(0);
            for await (const chunk of fs.createReadStream(filePath)) {
              const data = carry.length === 0 ? chunk : Buffer.concat([carry, chunk]);
              if (secretBytes.some((secret) => data.includes(secret))) {
                return true;
              }
              carry = data.subarray(Math.max(0, data.length - carrySize));
            }
            return false;
          }

          (async () => {
            for await (const filePath of filesUnder(outputRoot)) {
              if (await containsCredential(filePath)) {
                fail('The Unity build output contains a configured credential value.');
              }
            }
            console.log('Verified source-safe, credential-free Unity build output.');
          })().catch(() => fail('Could not verify Unity build output contents.'));
          NODE

      - name: Archive Linux player with permissions
        if: matrix.targetPlatform == 'StandaloneLinux64'
        run: tar -czf "$RUNNER_TEMP/StandaloneLinux64.tar.gz" -C build StandaloneLinux64

      - name: Upload platform build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unity-${{ matrix.targetPlatform }}
          path: ${{ matrix.targetPlatform == 'StandaloneLinux64' && format('{0}/StandaloneLinux64.tar.gz', runner.temp) || format('build/{0}', matrix.targetPlatform) }}
          if-no-files-found: error
          retention-days: 7
