name: Unity build

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Direct dispatch is limited to this workflow on main. Reusable callers
    # must be from this repository, use an allowed event, and target main or
    # a version tag. Excluding this workflow's own path prevents direct tag
    # dispatches from being mistaken for reusable calls.
    if: >-
      github.repository == 'kurone-kito/DDMMHBC' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@refs/heads/main'
        ) ||
        (
          !startsWith(github.workflow_ref, 'kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@') &&
          contains(fromJSON('["push","schedule","release","workflow_dispatch"]'), github.event_name) &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        )
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneLinux64
            runner: ubuntu-24.04
          - targetPlatform: StandaloneWindows64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build Unity player
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: build

      - name: Upload platform build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unity-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error
          retention-days: 7
