name: Unity build

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This workflow passes repository secrets to build code. Same-repository
    # PR callers are trusted; fork PRs and pull_request_target callers are not.
    # Direct and reusable manual dispatches are main-only. Branch and release
    # refs use their event-specific rules below. Exclude this workflow's own
    # path from reusable-caller checks so direct dispatches cannot use the
    # wider policy.
    if: >-
      github.repository == 'kurone-kito/DDMMHBC' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@refs/heads/main'
        ) ||
        (
          !startsWith(github.workflow_ref, 'kurone-kito/DDMMHBC/.github/workflows/unity-build.yml@') &&
          (
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')) ||
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.base.repo.full_name == 'kurone-kito/DDMMHBC' &&
              github.event.pull_request.base.ref == 'main' &&
              github.event.pull_request.head.repo.full_name == 'kurone-kito/DDMMHBC'
            )
          )
        )
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneLinux64
            runner: ubuntu-24.04
          - targetPlatform: StandaloneWindows64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build Unity player
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: build

      - name: Archive Linux player with permissions
        if: matrix.targetPlatform == 'StandaloneLinux64'
        run: tar -czf build/StandaloneLinux64.tar.gz -C build StandaloneLinux64

      - name: Upload platform build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unity-${{ matrix.targetPlatform }}
          path: ${{ matrix.targetPlatform == 'StandaloneLinux64' && 'build/StandaloneLinux64.tar.gz' || format('build/{0}', matrix.targetPlatform) }}
          if-no-files-found: error
          retention-days: 7
