name: Publish release builds

# cspell:ignore rglob isfile isinstance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release-tag:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - id: validate
        name: Validate trusted version tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUSH_ACTOR: ${{ github.actor }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo 'Release tags must start with v.' >&2
              exit 1
              ;;
          esac
          if [ "$PUSH_ACTOR" != "$REPOSITORY_OWNER" ]; then
            echo 'Only the repository owner may start a release build.' >&2
            exit 1
          fi
          stable_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)$'
          if [[ "$RELEASE_TAG" =~ $stable_pattern ]]; then
            prerelease=false
          elif [[ "$RELEASE_TAG" =~ $prerelease_pattern ]]; then
            prerelease=true
          else
            echo 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The pushed source SHA is missing or invalid.' >&2
            exit 1
          fi
          tag_sha="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo 'The release tag no longer resolves to the pushed source SHA.' >&2
            exit 1
          fi
          comparison_status="$(gh api "repos/${GH_REPO}/compare/main...${RELEASE_SHA}" --jq '.status')"
          case "$comparison_status" in
            behind|identical) ;;
            *)
              echo 'The release source must be reachable from main.' >&2
              exit 1
              ;;
          esac
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"

  build-release:
    needs: validate-release-tag
    permissions:
      contents: read
    uses: ./.github/workflows/unity-build.yml
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  publish-release:
    needs:
      - validate-release-tag
      - build-release
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download Windows player
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unity-StandaloneWindows64
          path: ${{ runner.temp }}/release-windows

      - name: Download Linux player archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unity-StandaloneLinux64
          path: ${{ runner.temp }}/release-linux

      - name: Verify and package release builds
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["RUNNER_TEMP"])
          windows_dir = root / "release-windows"
          linux_artifact = root / "release-linux" / "StandaloneLinux64.tar.gz"
          windows_archive = root / "DDMMHBC-Windows.zip"
          linux_player = "StandaloneLinux64/StandaloneLinux64"
          linux_data_prefix = "StandaloneLinux64/StandaloneLinux64_Data/"
          linux_player_library = "StandaloneLinux64/UnityPlayer.so"

          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)

          def sensitive_name(name):
              lowered = [part.lower() for part in PurePosixPath(name).parts]
              suffixes = (".ulf", ".alf", ".lic", ".p12", ".pfx", ".pem", ".key")
              terms = ("license", "credential", "secret", "password")
              return any(
                  part.endswith(suffix) for part in lowered for suffix in suffixes
              ) or any(term in part for part in lowered for term in terms)

          def safe_linux_member_path(name):
              if "\\" in name:
                  return None
              path = PurePosixPath(name)
              if (
                  not path.parts
                  or path.is_absolute()
                  or ".." in path.parts
                  or path.parts[0].endswith(":")
              ):
                  return None
              return path.as_posix()

          windows_exe = windows_dir / "StandaloneWindows64.exe"
          windows_data = windows_dir / "StandaloneWindows64_Data"
          if not windows_exe.is_file() or not windows_data.is_dir():
              fail("Windows build is missing StandaloneWindows64.exe or StandaloneWindows64_Data.")
          if not (windows_dir / "UnityPlayer.dll").is_file():
              fail("Windows build is missing UnityPlayer.dll.")

          windows_files = sorted(
              path for path in windows_dir.rglob("*") if path.is_file()
          )
          if not windows_files:
              fail("Windows build artifact is empty.")
          if any(
              sensitive_name(path.relative_to(windows_dir).as_posix())
              for path in windows_files
          ):
              fail("Windows build contains a credential or license filename.")

          if not linux_artifact.is_file():
              fail("Linux build artifact is missing StandaloneLinux64.tar.gz.")
          try:
              with tarfile.open(linux_artifact, "r:gz") as archive:
                  members = archive.getmembers()
          except (OSError, tarfile.TarError) as error:
              fail(f"Linux build archive is unreadable: {error}")

          normalized_members = []
          for member in members:
              normalized_name = safe_linux_member_path(member.name)
              if normalized_name is None:
                  fail("Linux build archive contains an unsafe path.")
              if not (member.isfile() or member.isdir()):
                  fail("Linux build archive contains an unsupported entry type.")
              normalized_members.append((member, normalized_name))

          member_names = [name for _, name in normalized_members]
          if any(sensitive_name(name) for name in member_names):
              fail("Linux build contains a credential or license filename.")
          executable = next(
              (member for member, name in normalized_members
               if name == linux_player
               and member.isfile() and member.mode & 0o111),
              None,
          )
          if executable is None:
              fail("Linux build archive is missing executable DDMMHBC.x86_64.")
          if not any(
              member.isfile()
              and name.startswith(linux_data_prefix)
              for member, name in normalized_members
          ):
              fail("Linux build archive is missing DDMMHBC_Data runtime files.")
          if not any(
              name == linux_player_library and member.isfile()
              for member, name in normalized_members
          ):
              fail("Linux build archive is missing UnityPlayer.so.")

          with zipfile.ZipFile(
              windows_archive,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=1,
          ) as output:
              for path in windows_files:
                  output.write(path, path.relative_to(windows_dir).as_posix())

          with zipfile.ZipFile(windows_archive) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  fail("Windows release archive failed its integrity check.")
              names = archive.namelist()
              if "StandaloneWindows64.exe" not in names or not any(
                  name.startswith("StandaloneWindows64_Data/") for name in names
              ):
                  fail("Windows release archive is missing required player files.")
              if any(sensitive_name(name) for name in names):
                  fail("Windows release archive contains a credential or license filename.")

          print("Verified Windows and Linux player archives; no credential or license filenames found.")
          PY

      - name: Attach release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PRERELEASE: ${{ needs.validate-release-tag.outputs.prerelease }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          source_sha = os.environ["RELEASE_SHA"]
          expected_prerelease = os.environ["RELEASE_PRERELEASE"] == "true"
          root = Path(os.environ["RUNNER_TEMP"])
          expected_assets = [
              ("DDMMHBC-Windows.zip", root / "DDMMHBC-Windows.zip"),
              (
                  "StandaloneLinux64.tar.gz",
                  root / "release-linux" / "StandaloneLinux64.tar.gz",
              ),
          ]
          asset_manifest_marker = "<!-- ddmmhbc-release-assets:v1 -->"

          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)

          def run_gh(*args):
              result = subprocess.run(
                  ["gh", *args], capture_output=True, check=False, text=True
              )
              if result.returncode != 0:
                  if result.stderr.strip():
                      print(result.stderr.rstrip(), file=sys.stderr)
                  else:
                      print(
                          f"GitHub CLI command failed with exit code {result.returncode}.",
                          file=sys.stderr,
                      )
                  raise SystemExit(result.returncode)
              return result.stdout

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as artifact:
                  for chunk in iter(lambda: artifact.read(1024 * 1024), b""):
                      digest.update(chunk)
              return f"sha256:{digest.hexdigest()}"

          def resolve_tag_commit():
              resolved = json.loads(
                  run_gh("api", f"repos/{repo}/commits/{tag}")
              ).get("sha")
              if resolved != source_sha:
                  fail("Release tag no longer resolves to the built source SHA.")
              status = run_gh(
                  "api", f"repos/{repo}/compare/main...{source_sha}", "--jq", ".status"
              ).strip()
              if status not in ("behind", "identical"):
                  fail("Release source is no longer reachable from main.")

          def read_release():
              release_pages = json.loads(
                  run_gh(
                      "api",
                      "--paginate",
                      "--slurp",
                      f"repos/{repo}/releases?per_page=100",
                  )
              )
              if type(release_pages) is not list or any(
                  type(page) is not list for page in release_pages
              ):
                  fail("GitHub returned an unexpected release listing.")
              matching_releases = [
                  release
                  for page in release_pages
                  for release in page
                  if release.get("tag_name") == tag
              ]
              if len(matching_releases) > 1:
                  fail("Multiple releases use the pushed version tag.")
              if not matching_releases:
                  return None
              release_id = matching_releases[0].get("id")
              if type(release_id) is not int:
                  fail("Could not determine the release ID for the pushed tag.")
              return json.loads(run_gh("api", f"repos/{repo}/releases/{release_id}"))

          def release_assets(release_id):
              asset_pages = json.loads(
                  run_gh(
                      "api",
                      "--paginate",
                      "--slurp",
                      f"repos/{repo}/releases/{release_id}/assets?per_page=100",
                  )
              )
              if type(asset_pages) is not list or any(
                  type(page) is not list for page in asset_pages
              ):
                  fail("GitHub returned an unexpected release asset listing.")
              return [asset for page in asset_pages for asset in page]

          def read_asset_manifest(release):
              if type(release) is not dict:
                  fail("Could not read the release asset digest manifest.")
              body = release.get("body")
              if not isinstance(body, str) or asset_manifest_marker not in body:
                  return None
              if body.count(asset_manifest_marker) != 1:
                  fail("Release contains multiple asset digest manifests.")
              manifest_body = body.split(asset_manifest_marker, 1)[1].strip()
              manifest = {}
              for line in manifest_body.splitlines():
                  match = re.fullmatch(r"([^=\n]+)=sha256:([0-9a-f]{64})", line)
                  if match is None or match.group(1) in manifest:
                      fail("Release asset digest manifest is malformed.")
                  manifest[match.group(1)] = f"sha256:{match.group(2)}"
              expected_names = {name for name, _ in expected_assets}
              if set(manifest) != expected_names:
                  fail("Release asset digest manifest does not list the expected archives.")
              return manifest

          def write_asset_manifest(release, digests):
              release_id = validate_release(release, expected_draft=True)
              body = release.get("body")
              if not isinstance(body, str):
                  fail("Draft release notes are missing; cannot record asset digests.")
              if body.count(asset_manifest_marker) > 1:
                  fail("Draft release contains multiple asset digest manifests.")
              notes = body.split(asset_manifest_marker, 1)[0].rstrip()
              entries = [f"{name}={digests[name]}" for name, _ in expected_assets]
              if notes:
                  notes += "\n\n"
              notes += asset_manifest_marker + "\n" + "\n".join(entries) + "\n"
              run_gh(
                  "api",
                  f"repos/{repo}/releases/{release_id}",
                  "--method",
                  "PATCH",
                  "-f",
                  f"body={notes}",
              )

          def validate_release(release, expected_draft):
              if type(release) is not dict:
                  fail("Could not read the release for the pushed version tag.")
              release_id = release.get("id")
              if type(release_id) is not int:
                  fail("Could not determine the release ID for asset verification.")
              if release.get("tag_name") != tag:
                  fail("Release tag does not match the pushed version tag.")
              if release.get("draft") is not expected_draft:
                  fail("Release draft state does not match the expected publication phase.")
              if release.get("prerelease") is not expected_prerelease:
                  fail("Release prerelease state does not match its version tag.")
              return release_id

          def verify_release(release, expected_draft, expected_digests):
              release_id = validate_release(release, expected_draft)
              if not expected_draft and release.get("immutable") is not True:
                  fail("Published release is not immutable; refusing to trust its asset manifest.")
              manifest = read_asset_manifest(release)
              if manifest is not None and manifest != expected_digests:
                  fail("Release asset digest manifest does not match the expected digests.")
              assets = release_assets(release_id)
              expected_names = {name for name, _ in expected_assets}
              if {asset.get("name") for asset in assets} != expected_names:
                  fail("Release does not contain exactly the two expected archives.")
              if len(assets) != len(expected_assets):
                  fail("Release contains duplicate or unexpected archive assets.")

              for name, path in expected_assets:
                  if not path.is_file():
                      fail(f"Expected release asset file is missing: {name}")
                  matches = [asset for asset in assets if asset.get("name") == name]
                  if len(matches) != 1:
                      fail(f"Release must contain exactly one {name} asset.")
                  asset = matches[0]
                  if (
                      asset.get("state") != "uploaded"
                      or asset.get("digest") != expected_digests.get(name)
                  ):
                      fail(f"Release asset is incomplete or has an unexpected digest: {name}")
              return release

          for _, path in expected_assets:
              if not path.is_file():
                  fail(f"Expected release asset file is missing: {path.name}")

          resolve_tag_commit()
          release = read_release()
          if release is None:
              prerelease_args = ["--prerelease"] if expected_prerelease else []
              run_gh(
                  "release",
                  "create",
                  tag,
                  "--draft",
                  "--verify-tag",
                  "--target",
                  source_sha,
                  "--generate-notes",
                  *prerelease_args,
                  "--repo",
                  repo,
              )
              release = read_release()

          if release is None:
              fail("Release creation succeeded but the release is not visible yet.")

          if release.get("draft") is not True:
              manifest = read_asset_manifest(release)
              if manifest is None:
                  fail("Published release has no verified asset digest manifest.")
              resolve_tag_commit()
              verify_release(release, expected_draft=False, expected_digests=manifest)
              resolve_tag_commit()
              print("The published release already contains the verified archives.")
              raise SystemExit(0)

          release_id = validate_release(release, expected_draft=True)
          manifest = read_asset_manifest(release)
          expected_digests = (
              dict(manifest)
              if manifest is not None
              else {name: sha256(path) for name, path in expected_assets}
          )
          assets = release_assets(release_id)
          expected_names = {name for name, _ in expected_assets}
          if any(asset.get("name") not in expected_names for asset in assets):
              fail("Draft release contains an unexpected asset; refusing to replace it.")
          if len({asset.get("name") for asset in assets}) != len(assets):
              fail("Draft release contains duplicate assets; refusing to replace them.")

          uploads = []
          for name, path in expected_assets:
              matches = [asset for asset in assets if asset.get("name") == name]
              if not matches:
                  # No bytes exist on GitHub for this asset yet. Record this
                  # build's digest before uploading so retries can resume.
                  expected_digests[name] = sha256(path)
                  uploads.append(path)
                  continue
              asset = matches[0]
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("digest") != expected_digests[name]
              ):
                  fail(f"Draft release contains a conflicting {name}; refusing to replace it.")
              print(f"Reusing matching release asset: {name}")

          if manifest is None or expected_digests != manifest:
              # Persist the digest baseline before any upload. Existing assets
              # retain their verified digests; only missing assets adopt the
              # current tag build's digest, making partial draft retries safe.
              write_asset_manifest(release, expected_digests)
              release = read_release()
              manifest = read_asset_manifest(release)
              if manifest != expected_digests:
                  fail("Could not verify the recorded release asset digest manifest.")

          if uploads:
              run_gh(
                  "release",
                  "upload",
                  tag,
                  *(str(path) for path in uploads),
                  "--repo",
                  repo,
              )
              print(f"Uploaded {len(uploads)} missing release asset(s).")
          else:
              print("Both release assets already match; no upload was needed.")

          release = read_release()
          verify_release(
              release,
              expected_draft=True,
              expected_digests=expected_digests,
          )
          resolve_tag_commit()
          run_gh("release", "edit", tag, "--draft=false", "--repo", repo)
          release = read_release()
          verify_release(
              release,
              expected_draft=False,
              expected_digests=expected_digests,
          )
          resolve_tag_commit()
          print("Published the verified Windows and Linux release archives.")
          PY
