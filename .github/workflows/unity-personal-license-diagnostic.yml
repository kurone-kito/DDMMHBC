name: Unity Personal license diagnostic

on:
  push:
    branches:
      - issue/24-ci-diagnose-unity-personal-route-one
    paths:
      - .github/workflows/unity-personal-license-diagnostic.yml

permissions:
  contents: read

jobs:
  linux-player-diagnostic:
    if: github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the trusted default-branch project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4e3b47fe763f7374b44f0fb2210aafe5db54fa38 # main at preparation time
          persist-credentials: false

      - name: Build one Linux player with Unity 6000.3.26f1
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: "6000.3.26f1"
          targetPlatform: StandaloneLinux64
